<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow-x: hidden;
            /* Dynamic Gradient Background */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card Effect */
        .registration-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: none;
            transform: translateY(30px);
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
            max-width: 500px;
            width: 100%;
        }

        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .form-control, .form-select {
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid #ddd;
        }

        /* Input focus animation */
        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 10px rgba(37, 117, 252, 0.2);
            transform: scale(1.02);
        }

        .btn-submit {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 12px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Radio & Checkbox Customization */
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
    </style>
</head>

<script>
    // Dynamic Form Interaction
    const form = document.getElementById('registrationForm');
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Simple Password Validation Logic
        const pass = document.getElementById('pass').value;
        const confirm = document.getElementById('confirm_pass').value;
        
        if(pass !== confirm) {
            alert("Passwords do not match!");
            return;
        }

        // Animated Success Feedback
        const btn = document.querySelector('.btn-submit');
        btn.innerHTML = 'Sending... ⏳';
        btn.style.opacity = '0.7';
        
        setTimeout(() => {
            alert('Registration Successful! (Dynamic Simulation)');
            btn.innerHTML = 'Register Now';
            btn.style.opacity = '1';
        }, 1500);
    });
</script>
