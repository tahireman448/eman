
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Interactive Chat</title>
<style>
:root {
--sidebar-width: 280px;
--sidebar-bg: #1e1e1e;
--main-bg: #131314;
--input-bg: #202123;
--text-color: #e3e3e3;
--accent-blue: #4b90ff;
--user-msg-bg: #2b2c2f;
}

body, html {
margin: 0; padding: 0; height: 100%;
font-family: 'Segoe UI', Roboto, sans-serif;
background-color: var(--main-bg);
color: var(--text-color);
overflow: hidden;
}

.wrapper { display: flex; height: 100vh; }

/* -
-SIDEBAR -
-*/
.sidebar {
width: var(--sidebar-width);
background-color: var(--sidebar-bg);
height: 100%;
position: fixed;
left: 0; transition: 0.3s;
z-index: 1000;
display: flex; flex-direction: column;
border-right: 1px solid #333;
}
/* -
-MAIN CONTAINER -
-*/
.main-container {
flex: 1; margin-left: var(--sidebar-width);
display: flex; flex-direction: column; height: 100%;
transition: 0.3s;
}
.top-bar {
display: none; padding: 15px;
background: var(--main-bg); align-items: center;
}

.hamburger {
font-size: 24px; background: none; border: none;
color: white; cursor: pointer;
}

/* -
-CHAT WINDOW -
-*/
#chatWindow {
flex: 1; overflow-y: auto; padding: 20px;
display: flex; flex-direction: column; gap: 20px;
}
.message {
max-width: 800px; width: 90%; margin: 0 auto;
padding: 15px; border-radius: 10px;
animation: fadeIn 0.3s ease;
}

.user-message { background-color: var(--user-msg-bg); align-self: center; }
.ai-message { border-left: 3px solid var(--accent-blue); align-self: center; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* -
-INPUT AREA -
-*/
.input-area { padding: 20px; background: var(--main-bg); }
.input-box {
max-width: 800px; margin: 0 auto;
background: var(--input-bg); border-radius: 30px;
display: flex; padding: 8px 15px; border: 1px solid #444;
}
.chat-input {
flex: 1; background: none; border: none; color: white;
padding: 12px; font-size: 16px; outline: none;
}

.send-btn {
background: var(--accent-blue); color: white; border: none;
padding: 0 20px; border-radius: 20px; cursor: pointer; font-weight: bold;
}

/* -
-RESPONSIVE -
-*/
@media (max-width: 992px) {
.sidebar { transform: translateX(-100%); }
.sidebar.active { transform: translateX(0); }
.main-container { margin-left: 0; }
.top-bar { display: flex; }
}
.overlay {
display: none; position: fixed; inset: 0;
background: rgba(0,0,0,0.6); z-index: 999;
}
.overlay.active { display: block; }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="wrapper">
<nav class="sidebar" id="sidebar">
<div style="padding: 25px; font-weight: bold; font-size: 1.2rem;">Gemini Clone</div>
<div style="padding: 10px;">
<button style="width: 100%; padding: 10px; border-radius: 5px; cursor: pointer; background: #333; color: white; border: none;">+ New Chat</button>
</div>
</nav>

<div class="main-container">
<header class="top-bar">
<button class="hamburger" id="menuToggle">☰</button>
<div style="margin-left: 15px;">Gemini AI</div>
</header>

<div id="chatWindow">
<div class="message ai-message">
<strong>AI:</strong> Hello! Main aapki kaise madad kar sakta hoon?
</div>
</div>

<div class="input-area">
<div class="input-box">
<input type="text" id="userInput" class="chat-input" placeholder="Yahan type karein...">
<button id="sendBtn" class="send-btn">Send</button>
</div>
</div>
</div>
</div>

<script>
const menuToggle = document.getElementById('menuToggle');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const chatWindow = document.getElementById('chatWindow');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

// Sidebar Toggle
function toggleMenu() {
sidebar.classList.toggle('active');
overlay.classList.toggle('active');
}
menuToggle.onclick = toggleMenu;
overlay.onclick = toggleMenu;

// Message Handling
function sendMessage() {
const text = userInput.value.trim();
if (text === "") return;

// 1. Append User Message
appendMessage('You', text, 'user-message');
userInput.value = "";

// 2. Simulate AI Response (Simple logic)
setTimeout(() => {
appendMessage('AI', 'Aapne kaha: "' + text + '". Main is par kaam kar raha hoon.', 'ai-message');
}, 1000);
}

function appendMessage(sender, text, className) {
const msgDiv = document.createElement('div');
msgDiv.className = `message ${className}`;
msgDiv.innerHTML = `<strong>${sender}:</strong> <p>${text}</p>`;
chatWindow.appendChild(msgDiv);

// Auto scroll to bottom
chatWindow.scrollTop = chatWindow.scrollHeight;
}

sendBtn.onclick = sendMessage;

// Enter key support
userInput.addEventListener("keypress", (e) => {
if (e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
