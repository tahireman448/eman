<!DOCTYPE html>
<html lang="en">
<head>

<title>YouTube Video Integration</title>
<style>
.video-container {
max-width: 800px;

}
iframe {
width: 100%;
height: 450px;

border: none;
}
</style>
</head>
<body>

<div class="video-container">
<h2>Tu Hai Mera Khuda
Danish Taimoor</h2>
<iframe src="" frameborder="0"></iframe>
<iframe
src="https://www.youtube.com/embed/YYMQR9R4veM"
title="Tu Hai Mera Khuda, Tu Hai Sab Se Bara | Hamd | Danish Taimoor"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>
</div>
</body>
</html>
