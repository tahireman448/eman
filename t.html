<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Store Ultimate</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* LOADER */
#loader{
position:fixed;
width:100%;
height:100vh;
background:black;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
z-index:9999;
animation:fadeOut 2s forwards;
animation-delay:1.5s;
}
@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* BACKGROUND ANIMATION */
body{
font-family:Arial;
background:linear-gradient(-45deg,#f5f7fa,#c3cfe2,#e0c3fc,#8ec5fc);
background-size:400% 400%;
animation:gradientMove 12s ease infinite;
transition:0.4s;
}
@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.dark-mode{
background:#1e1e1e !important;
color:white;
}

/* HEADER */
header{
background:black;
color:white;
padding:20px;
text-align:center;
}

/* CARD */
.card{
border-radius:15px;
transition:0.4s;
animation:slideUp 0.8s ease;
}
.card:hover{
transform:scale(1.05);
}
@keyframes slideUp{
from{transform:translateY(40px);opacity:0;}
to{transform:translateY(0);opacity:1;}
}

/* CART */
.cart-box{
background:white;
padding:15px;
border-radius:15px;
animation:zoomIn 0.5s ease;
}
.dark-mode .cart-box{
background:#333;
}
@keyframes zoomIn{
from{transform:scale(0.8);opacity:0;}
to{transform:scale(1);opacity:1;}
}

/* BUTTON RIPPLE */
button{
border-radius:20px !important;
position:relative;
overflow:hidden;
}
button:active{
transform:scale(0.95);
}

/* TOAST */
.toast-msg{
position:fixed;
bottom:20px;
right:20px;
background:black;
color:white;
padding:10px 20px;
border-radius:20px;
display:none;
}

/* SUCCESS POPUP */
.success-popup{
position:fixed;
top:20px;
right:20px;
background:green;
color:white;
padding:10px 20px;
border-radius:10px;
display:none;
}

/* HIDE PAGES */
#storePage,#walletPage,#adminPage{display:none;}

</style>
</head>

<body>

<div id="loader">Loading Fashion Store...</div>
<div class="toast-msg" id="toast"></div>
<div class="success-popup" id="popup">Payment Successful 🎉</div>

<header>
<h1>Fashion Store Ultimate 🛍️</h1>
<button class="btn btn-light" onclick="toggleDark()">🌙 Dark Mode</button>
<button class="btn btn-danger" onclick="openAdmin()">Admin</button>
</header>

<!-- LOGIN -->
<div class="container text-center mt-4" id="loginPage">
<h3>Login</h3>
<input type="text" id="username" placeholder="Username" class="form-control w-50 mx-auto"><br>
<input type="password" id="password" placeholder="Password" class="form-control w-50 mx-auto"><br>
<button class="btn btn-dark" onclick="login()">Login</button>
</div>

<!-- STORE -->
<div class="container mt-4" id="storePage">

<h4>Welcome, <span id="userDisplay"></span></h4>

<p>EasyPaisa: Rs <span id="easyBalance"></span> |
JazzCash: Rs <span id="jazzBalance"></span></p>

<button class="btn btn-warning" onclick="showWallet()">Wallet</button>

<input type="text" id="search" placeholder="Search products..." class="form-control w-50 my-3">

<div class="row" id="productList"></div>

<div class="cart-box mt-4">
<h4>🛒 Cart</h4>
<ul id="cartList"></ul>
<h5>Total: Rs <span id="totalAmount">0</span></h5>

<input type="text" id="discountCode" placeholder="Discount Code" class="form-control w-50">
<button class="btn btn-info mt-2" onclick="applyDiscount()">Apply Discount</button>
<br><br>
<button class="btn btn-success" onclick="checkout()">Checkout</button>
</div>

<h4 class="mt-5">📦 Order History</h4>
<ul id="historyList"></ul>

</div>

<!-- WALLET -->
<div class="container text-center mt-4" id="walletPage">
<h3>Wallet</h3>
<input type="number" id="easyAmount" placeholder="Add EasyPaisa" class="form-control w-50 mx-auto">
<button class="btn btn-dark mt-2" onclick="addMoney('easy')">Add</button>

<input type="number" id="jazzAmount" placeholder="Add JazzCash" class="form-control w-50 mx-auto mt-3">
<button class="btn btn-dark mt-2" onclick="addMoney('jazz')">Add</button>

<br><br>
<button class="btn btn-danger" onclick="backToStore()">Back</button>
</div>

<!-- ADMIN DASHBOARD -->
<div class="container mt-4" id="adminPage">
<h3>📊 Admin Dashboard</h3>
<p>Total Sales: Rs <span id="salesAmount">0</span></p>
<p>Total Orders: <span id="orderCount">0</span></p>
<button class="btn btn-danger" onclick="closeAdmin()">Close</button>
</div>

<script>

/* DATA */
let easyPaisa=parseInt(localStorage.getItem("easy"))||0;
let jazzCash=parseInt(localStorage.getItem("jazz"))||0;
let sales=parseInt(localStorage.getItem("sales"))||0;
let orders=parseInt(localStorage.getItem("orders"))||0;
let cart=[];
let total=0;

const products=[
{name:"Shirt",price:500,img:"https://picsum.photos/200?1"},
{name:"Jeans",price:800,img:"https://picsum.photos/200?2"},
{name:"Jacket",price:1200,img:"https://picsum.photos/200?3"},
{name:"Shoes",price:1500,img:"https://picsum.photos/200?4"},
{name:"Watch",price:2000,img:"https://picsum.photos/200?5"},
{name:"Bag",price:900,img:"https://picsum.photos/200?6"},
{name:"Cap",price:300,img:"https://picsum.photos/200?7"}
];

/* TOAST */
function showToast(msg){
toast.style.display="block";
toast.textContent=msg;
setTimeout(()=>toast.style.display="none",2000);
}

/* RENDER PRODUCTS */
function renderProducts(list=products){
productList.innerHTML="";
list.forEach(p=>{
productList.innerHTML+=`
<div class="col-md-4 mb-4">
<div class="card">
<img src="${p.img}" class="card-img-top">
<div class="card-body text-center">
<h5>${p.name}</h5>
<p>Rs ${p.price}</p>
<button class="btn btn-dark" onclick="addToCart('${p.name}',${p.price})">Add</button>
</div>
</div>
</div>`;
});
}

/* LOGIN */
function login(){
if(username.value&&password.value){
loginPage.style.display="none";
storePage.style.display="block";
userDisplay.textContent=username.value;
updateWallet();
renderProducts();
showToast("Welcome "+username.value);
}
}

/* CART */
function addToCart(name,price){
cart.push({name,price});
total+=price;
cartList.innerHTML+=`<li>${name} - Rs ${price}</li>`;
totalAmount.textContent=total;
showToast("Added to cart");
}

/* DISCOUNT */
function applyDiscount(){
if(discountCode.value==="SAVE10"){
total=Math.floor(total*0.9);
totalAmount.textContent=total;
showToast("10% Discount Applied");
}
}

/* CHECKOUT */
function checkout(){
let method=prompt("easy or jazz?");
if(method==="easy"&&easyPaisa>=total){
easyPaisa-=total;
completeOrder();
}
else if(method==="jazz"&&jazzCash>=total){
jazzCash-=total;
completeOrder();
}
else showToast("Not enough balance");
updateWallet();
}

function completeOrder(){
sales+=total;
orders++;
historyList.innerHTML+=`<li>Order Rs ${total}</li>`;
localStorage.setItem("sales",sales);
localStorage.setItem("orders",orders);
popup.style.display="block";
setTimeout(()=>popup.style.display="none",2000);
cartList.innerHTML="";
total=0;
totalAmount.textContent=0;
}

/* WALLET */
function addMoney(type){
if(type==="easy") easyPaisa+=parseInt(easyAmount.value||0);
if(type==="jazz") jazzCash+=parseInt(jazzAmount.value||0);
updateWallet();
showToast("Money Added");
}

function updateWallet(){
easyBalance.textContent=easyPaisa;
jazzBalance.textContent=jazzCash;
localStorage.setItem("easy",easyPaisa);
localStorage.setItem("jazz",jazzCash);
}

/* SEARCH */
search.addEventListener("input",function(){
let val=this.value.toLowerCase();
let filtered=products.filter(p=>p.name.toLowerCase().includes(val));
renderProducts(filtered);
});

/* PAGE SWITCH */
function showWallet(){storePage.style.display="none";walletPage.style.display="block";}
function backToStore(){walletPage.style.display="none";storePage.style.display="block";}
function toggleDark(){document.body.classList.toggle("dark-mode");}

/* ADMIN */
function openAdmin(){
storePage.style.display="none";
adminPage.style.display="block";
salesAmount.textContent=sales;
orderCount.textContent=orders;
}
function closeAdmin(){
adminPage.style.display="none";
storePage.style.display="block";
}

updateWallet();
renderProducts();

</script>

</body>
</html>
