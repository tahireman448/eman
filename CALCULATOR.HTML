  <!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to right, #5b9bd5, #4a90e2);
    font-family: Arial, sans-serif;
}

.calculator {
    background: #000;
    padding: 20px;
    border-radius: 25px;
    width: 320px;
}

.display {
    color: white;
    font-size: 40px;
    text-align: right;
    padding: 20px 10px;
    overflow-x: auto;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

button {
    height: 65px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    cursor: pointer;
}

.gray {
    background: #a5a5a5;
}

.dark {
    background: #333;
    color: white;
}

.orange {
    background: orange;
    color: white;
}

.zero {
    grid-column: span 2;
    border-radius: 40px;
}
#e1{
    font-family: fantasy;
    font-size: xx-large;
    font-weight:bold;
    background: linear-gradient(30deg,red,orange,yellow,rgb(57, 57, 232),indigo,violet,);
} 

</style>
</head>

<body>
    <legend>

        <fieldset>
            <h1> Calculator</h1>
            <h3 id="e1">Made By <b>"Eman Tahir"</b></h3>
    
        </fieldset>
    </legend>
   <br><br/>
<div class="calculator">
    <div class="display" id="display">0</div>

    <div class="buttons">
        <button class="gray" onclick="clearDisplay()">AC</button>
        <button class="gray" onclick="appendValue('%')">%</button>
        <button class="gray" onclick="appendValue('/')">÷</button>
        <button class="orange" onclick="appendValue('*')">×</button>

        <button class="dark" onclick="appendValue('7')">7</button>
        <button class="dark" onclick="appendValue('8')">8</button>
        <button class="dark" onclick="appendValue('9')">9</button>
        <button class="orange" onclick="appendValue('-')">−</button>

        <button class="dark" onclick="appendValue('4')">4</button>
        <button class="dark" onclick="appendValue('5')">5</button>
        <button class="dark" onclick="appendValue('6')">6</button>
        <button class="orange" onclick="appendValue('+')">+</button>

        <button class="dark" onclick="appendValue('1')">1</button>
        <button class="dark" onclick="appendValue('2')">2</button>
        <button class="dark" onclick="appendValue('3')">3</button>
        <button class="orange" onclick="calculate()">=</button>

        <button class="dark zero" onclick="appendValue('0')">0</button>
        <button class="dark" onclick="appendValue('.')">.</button>
    </div>
</div>

<script>
let display = document.getElementById("display");

function appendValue(value) {
    if (display.innerText === "0") {
        display.innerText = value;
    } else {
        display.innerText += value;
    }
}

function clearDisplay() {
    display.innerText = "0";
}

function calculate() {
    try {
        display.innerText = eval(display.innerText);
    } catch {
        display.innerText = "Syntax Error";
    }
}
</script>

</body>
</html>
