<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMAN TAHIR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
              
</head>
<body>
  <style>
    /* Suggestions box */
    #suggestions {
      position: absolute;
      background: white;
      color: black;
      width: 100%;
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-top: none;
      z-index: 100;
    }

    #suggestions .suggestion-item {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    #suggestions .suggestion-item:hover {
      background-color: #f0f0f0;
    }

    #suggestions img {
      width: 50px;
      height: 50px;
      margin-right: 10px;
      object-fit: cover;
      border-radius: 4px;
    }

    #info {
      margin: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      max-width: 600px;
    }
  </style>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Link</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Dropdown
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Action</a></li>
            <li><a class="dropdown-item" href="#">Another action</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Something else here</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link disabled" aria-disabled="true">Disabled</a>
        </li>
      </ul><form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
      
    </div>
  </div>
</nav>



  <script>
    // Topics with info and image
    const topics = {
      "ALI RAZA": {
        info: "Ali Raza is a rising Pakistani television actor known for his expressive acting and charming screen presence. He is very famous actor",
        img: "http"
      },
      "JavaScript DOM": {
        info: "Manipulate HTML elements using JavaScript DOM methods.",
        img: "https://upload.wikimedia.org/wikipedia/commons/6/6a/JavaScript-logo.png"
      },
      "CSS Flexbox": {
        info: "Learn how to use Flexbox to make responsive layouts.",
        img: "https://upload.wikimedia.org/wikipedia/commons/d/d5/CSS3_logo_and_wordmark.svg"
      },
      "HTML Forms": {
        info: "Learn how to create and validate forms using HTML.",
        img: "https://upload.wikimedia.org/wikipedia/commons/6/61/HTML5_logo_and_wordmark.svg"
      },
      "React JS": {
        info: "Introduction to React JS for building interactive UI.",
        img: "https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg"
      },
      "Python Basics": {
        info: "Learn the basics of Python programming.",
        img: "https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg"
      },
      "Python Data Analysis": {
        info: "Use Python libraries like Pandas for data analysis.",
        img: "https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg"
      }
    };

    const searchInput = document.getElementById("search");
    const suggestionsDiv = document.getElementById("suggestions");
    const infoDiv = document.getElementById("info");

    searchInput.addEventListener("input", function() {
      const query = searchInput.value.trim().toLowerCase();
      suggestionsDiv.innerHTML = ""; // clear previous suggestions

      if (query === "") return;

      const matches = Object.keys(topics).filter(topic =>
        topic.toLowerCase().includes(query)
      );

      // Show suggestions with images
      matches.forEach(match => {
        const div = document.createElement("div");
        div.classList.add("suggestion-item");

        const img = document.createElement("img");
        img.src = topics[match].img;

        const text = document.createElement("span");
        text.textContent = match;

        div.appendChild(img);
        div.appendChild(text);

        div.addEventListener("click", function() {
          searchInput.value = match;
          infoDiv.innerHTML = `<h3>${match}</h3><p>${topics[match].info}</p><img src="${topics[match].img}" style="width:100px; margin-top:10px;">`;
          suggestionsDiv.innerHTML = "";
        });

        suggestionsDiv.appendChild(div);
      });

      if (matches.length === 0) {
        const div = document.createElement("div");
        div.textContent = "No topics found.";
        suggestionsDiv.appendChild(div);
      }
    });
  </script>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
